[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xlsx-faithful"
version = "0.1.0"
description = "往 Excel 模板里写数据,同时保住模板里的一切(表单控件、图形、打印设置)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["xlsx", "excel", "template", "openpyxl", "fidelity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/alex-712/xlsx-faithful"
Issues = "https://github.com/alex-712/xlsx-faithful/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/xlsx_faithful"]
